# Publish the image named in nextflow.config (params.container). Push a tag
# container-v<version>, e.g. container-v1.0.0, after changing the Dockerfile or
# containers/linux-64.lock, and set the same version in nextflow.config.
name: container

on:
  push:
    tags: ['container-v*']

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#container-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
